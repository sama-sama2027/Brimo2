<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Mengikuti ukuran asli gambar secara otomatis (tetap responsif jika gambar lebih lebar dari layar) */
    .auto-img {
      width: auto;
      height: auto;
      max-width: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <img
    id="loadingImg"
    src="https://imgbb.bid/images/2026/11/19/IMG_3072.jpeg"
    alt=""
    class="auto-img"
  >

  <script>
    const targetUrl = "data.html";
    const delayMs = 3000;

    window.addEventListener("load", () => {
      const img = document.getElementById("loadingImg");

      // Memastikan ukuran elemen mengikuti ukuran asli gambar
      if (img.naturalWidth && img.naturalHeight) {
        img.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      }

      setTimeout(() => {
        window.location.href = targetUrl;
      }, delayMs);
    });
  </script>

</body>
</html>
